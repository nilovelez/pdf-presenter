# Packaging for PDF Diva. Two outputs on Windows:
#   npm run dist        -> NSIS installer (unsigned) for GitHub Releases
#   npm run dist:store  -> MSIX package (appx target) for the Microsoft Store
#   npm run pack        -> unpacked folder, to try the packaged app quickly
# and one on macOS, built by GitHub Actions (.github/workflows/build-mac.yml):
#   npm run dist:mac    -> universal .dmg (Apple silicon and Intel), ad-hoc signed
# and one on Linux, also built by GitHub Actions (.github/workflows/build-linux.yml):
#   npm run dist:linux  -> .deb for Debian and Ubuntu (x64)
appId: com.nilovelez.pdfdiva
productName: PDF Diva
copyright: Copyright © 2026 Nilo Vélez

directories:
  output: release
  # App icon set: icon.ico / icon.png and the MSIX tile assets in appx/ (the Phosphor UI icons
  # live one level up, in resources/icons, and are not packaged as files).
  buildResources: resources/icons/app

# Everything the app needs at run time is bundled into dist/ by esbuild (PDF.js included),
# so node_modules is not shipped.
files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# License texts that must travel with every build (see CLAUDE.md). Electron itself already
# adds LICENSE.electron.txt and LICENSES.chromium.html next to the executable.
extraResources:
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: node_modules/pdfjs-dist/LICENSE
    to: licenses/LICENSE-pdfjs.txt
  - from: resources/icons/LICENSE-phosphor.txt
    to: licenses/LICENSE-phosphor.txt

mac:
  target:
    - target: dmg
      arch: universal
  category: public.app-category.productivity
  icon: resources/icons/app/icon-512.png
  darkModeSupport: true
  # Ad-hoc signature: free, no Apple account. Apple silicon refuses to run unsigned apps; with
  # this one macOS only warns that the developer cannot be verified (README explains "Open
  # Anyway"). Hardened runtime would reject Electron's own frameworks under an ad-hoc signature,
  # and it is only needed for notarization, which needs a paid Apple account.
  identity: "-"
  hardenedRuntime: false
  # Lists PDF Diva in "Open With" for PDFs; "Alternate" never makes it the default viewer.
  fileAssociations:
    - ext: pdf
      name: PDF Document
      role: Viewer
      rank: Alternate

dmg:
  artifactName: PDF-Diva-${version}.${ext}

linux:
  target:
    - target: deb
      arch: x64
  icon: resources/icons/app/icon-512.png
  category: Office
  synopsis: A presenter view for any PDF
  # The author has no e-mail in package.json, which the .deb would take as its maintainer.
  maintainer: Nilo Vélez
  # Lists PDF Diva in "Open with" for PDFs. It only becomes the default viewer if there is none.
  mimeTypes:
    - application/pdf

deb:
  artifactName: PDF-Diva-${version}-amd64.${ext}

win:
  target:
    - nsis
  extraResources:
    # Icon for PDFs opened with PDF Diva (installer.nsh). The MSIX uses PNGs in appx/ instead.
    - from: resources/icons/app/document_icon.ico
      to: document_icon.ico

nsis:
  artifactName: PDF-Diva-Setup-${version}.${ext}
  # Per-user install: no administrator rights needed.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  license: LICENSE
  # Uninstalling removes the saved settings (updates keep them), as PRIVACY.md says.
  deleteAppDataOnUninstall: true
  # Lists PDF Diva in "Open with…" for PDFs, without making it the default viewer.
  include: resources/installer.nsh

# Microsoft Store package. Identity values come from Partner Center (the app name "PDF Diva"
# is reserved there). The "RedViral" prefix belongs to the publisher account; users never see it.
appx:
  artifactName: PDF-Diva-${version}.${ext}
  applicationId: PDFDiva
  identityName: 4095RedViral.PDFDiva
  publisher: CN=140CA302-E9F8-47D7-BC52-9FEFCB98772E
  publisherDisplayName: Nilo Vélez
  displayName: PDF Diva
  # Tile background: the dark surface of the PDF Diva palette.
  backgroundColor: "#1D1C1B"
  languages:
    - es-ES
    - en-US
  # Lists PDF Diva in "Open with…" for PDFs (never as the default viewer).
  customExtensionsPath: resources/appx-extensions.xml
